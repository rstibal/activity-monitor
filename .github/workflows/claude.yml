name: Claude Code

# There is deliberately no automatic PR review job. One existed until
# 2.9.18, but it never reviewed anything: its instructions went through an
# input claude-code-action v1 no longer reads, so it exited in seconds and
# reported success. Changes to this plugin are committed straight to master
# rather than through PRs, so it was removed rather than repaired.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for Claude to perform (e.g. "fix bug in is_automated_context()")'
        required: true
        type: string

jobs:
  # Manually triggered from the Actions tab ("Run workflow" button).
  # You type a task in the prompt box; Claude implements it and opens a PR.
  # Does NOT require the Claude GitHub App or @claude comment parsing.
  manual-task:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ github.event.inputs.prompt }}
