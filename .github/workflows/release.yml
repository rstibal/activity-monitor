name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build/activity-monitor
          cp activity-monitor.php readme.txt uninstall.php build/activity-monitor/
          cp -r admin assets includes build/activity-monitor/
          cd build
          zip -r ../activity-monitor.zip activity-monitor

      - name: Verify zip uses forward-slash paths
        run: |
          # WordPress's uploader (both the ZipArchive and PclZip code paths)
          # only treats '/' as a directory separator inside a zip entry. A
          # backslash-separated entry gets extracted as one flat file whose
          # name is literally "includes\class-foo.php" instead of a nested
          # includes/class-foo.php -- this has broken an in-place upgrade
          # via the Plugins screen's Upload feature before. Fail the build
          # rather than ship a zip that can reproduce it.
          if unzip -l activity-monitor.zip | awk 'NR>3 {print $4}' | grep -q '\\'; then
            echo "::error::activity-monitor.zip contains backslash-separated paths -- this will corrupt an in-place upgrade via the WordPress Upload Plugin flow."
            unzip -l activity-monitor.zip | awk 'NR>3 {print $4}' | grep '\\'
            exit 1
          fi

      - name: Attach zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: activity-monitor.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-monitor
          path: activity-monitor.zip
